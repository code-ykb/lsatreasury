<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>LSA Treasury | Reset Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body style="max-width:520px; margin:40px auto; font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto;">
  <h2 style="margin:0 0 10px 0;">Reset Password</h2>
  <p id="rpStatus" style="color:#6b7280; margin-top:4px;"></p>

  <form id="resetForm" style="margin-top:12px;">
    <div class="form-row">
      <label>New Password</label>
      <input id="rp1" type="password" required minlength="6"/>
    </div>
    <div class="form-row">
      <label>Confirm Password</label>
      <input id="rp2" type="password" required minlength="6"/>
    </div>
    <div style="display:flex; gap:8px; margin-top:10px;">
      <button class="btn-primary" type="submit">Save Password</button>
    </div>
  </form>

  <script src="app.js"></script>
</body>
</html>
